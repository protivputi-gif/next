<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F9FAFB;
            --bg-tertiary: #F3F4F6;
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --text-muted: #9CA3AF;
            --border-color: #E5E7EB;
            --accent-color: #2563EB;
            --accent-hover: #1D4ED8;
            --success-color: #059669;
            --warning-color: #D97706;
            --error-color: #DC2626;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 380px;
            width: 100%;
            height: 100%;
        }

        /* Left Panel - Workspace */
        .workspace {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .workspace-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workspace-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .agent-selector {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .agent-select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-primary);
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            min-width: 180px;
        }

        .agent-select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            align-self: center;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .message.process {
            align-self: flex-start;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            width: 100%;
            max-width: 100%;
        }

        .process-thought { color: var(--accent-color); }
        .process-action { color: var(--warning-color); }
        .process-observation { color: var(--success-color); }
        .process-error { color: var(--error-color); }

        .message-content {
            word-wrap: break-word;
        }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content pre {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .message-content code {
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .message:not(.user) .message-content code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .user .message-content code {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: var(--font-sans);
            resize: none;
            min-height: 48px;
            max-height: 150px;
            line-height: 1.5;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .send-btn {
            padding: 12px 24px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        /* Right Panel - Context & Control */
        .sidebar {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .sidebar-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: var(--bg-tertiary);
        }

        /* Agent Cards */
        .agent-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .agent-card:hover {
            border-color: var(--accent-color);
            box-shadow: var(--shadow-sm);
        }

        .agent-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .agent-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }

        .agent-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-color);
        }

        .agent-model {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* Memory Lessons */
        .lesson-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 10px;
        }

        .lesson-keyword {
            font-weight: 600;
            font-size: 13px;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .lesson-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .lesson-count {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Create Agent Form */
        .create-agent-form {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            font-family: var(--font-sans);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .create-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .create-btn:hover {
            background: var(--accent-hover);
        }

        .toggle-form-btn {
            width: 100%;
            padding: 10px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-form-btn:hover {
            background: var(--border-color);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Loading indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .sidebar {
                border-top: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Workspace -->
        <div class="workspace">
            <div class="workspace-header">
                <div class="workspace-title">Nexus Hive 🐝</div>
                <div style="font-size:13px;color:var(--text-muted);">
                    <span id="hiveStatusText">Ожидание БОССА...</span>
                </div>
            </div>

            <div id="chatContainer" class="chat-container">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">Введите задачу для начала работы</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Опишите задачу..."
                        rows="1"
                    ></textarea>
                    <button id="sendBtn" class="send-btn">Отправить</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Context & Control -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Контекст и управление</div>
                <div class="sidebar-subtitle">Память и конфигурация</div>
            </div>

            <div class="sidebar-content">
                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div id="agentCount" class="stat-value">0</div>
                        <div class="stat-label">Агентов</div>
                    </div>
                    <div class="stat-card">
                        <div id="memoryNodes" class="stat-value">0</div>
                        <div class="stat-label">Узлов памяти</div>
                    </div>
                </div>

                <!-- Agents Section -->
                <div class="section">
                    <div class="section-title">
                        Активные агенты
                        <button id="refreshAgentsBtn" class="refresh-btn">↻</button>
                    </div>
                    <div id="agentsList">
                        <div class="empty-state">
                            <div class="empty-state-text">Нет активных агентов</div>
                        </div>
                    </div>
                    
                    <button id="toggleCreateAgentBtn" class="toggle-form-btn">+ Создать агента</button>
                    
                    <div id="createAgentForm" class="create-agent-form" style="display: none;">
                        <div class="form-group">
                            <label class="form-label">Имя</label>
                            <input type="text" id="agentName" class="form-input" placeholder="Agent1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Роль</label>
                            <input type="text" id="agentRole" class="form-input" placeholder="Assistant">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Модель</label>
                            <input type="text" id="agentModel" class="form-input" placeholder="meta/llama-3.1-8b-instruct">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Base URL</label>
                            <input type="text" id="agentBaseUrl" class="form-input" placeholder="https://integrate.api.nvidia.com/v1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">API Key</label>
                            <input type="password" id="agentApiKey" class="form-input" placeholder="nvapi-...">
                        </div>
                        <button id="createAgentBtn" class="create-btn">Создать</button>
                    </div>
                </div>

                <!-- Memory Lessons Section -->
                <div class="section">
                    <div class="section-title">
                        Уроки из памяти
                        <button id="refreshMemoryBtn" class="refresh-btn">↻</button>
                    </div>
                    <div id="memoryLessons">
                        <div class="empty-state">
                            <div class="empty-state-text">Нет сохраненных уроков</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = '';

        // State
        let hiveStatus = { boss: null, workers: [] };
        let currentEventSource = null;
        let isProcessing = false;

        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const taskInput = document.getElementById('taskInput');
        const sendBtn = document.getElementById('sendBtn');
        const agentsList = document.getElementById('agentsList');
        const memoryLessons = document.getElementById('memoryLessons');
        const agentCountEl = document.getElementById('agentCount');
        const memoryNodesEl = document.getElementById('memoryNodes');
        const toggleCreateAgentBtn = document.getElementById('toggleCreateAgentBtn');
        const createAgentForm = document.getElementById('createAgentForm');
        const createAgentBtn = document.getElementById('createAgentBtn');
        const refreshAgentsBtn = document.getElementById('refreshAgentsBtn');
        const refreshMemoryBtn = document.getElementById('refreshMemoryBtn');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAgents();
            loadMemory();
            setupEventListeners();
            autoResizeTextarea();
        });

        // Event Listeners
        function setupEventListeners() {
            sendBtn.addEventListener('click', sendMessage);
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            taskInput.addEventListener('input', autoResizeTextarea);
            toggleCreateAgentBtn.addEventListener('click', toggleCreateAgentForm);
            createAgentBtn.addEventListener('click', createAgent);
            refreshAgentsBtn.addEventListener('click', loadAgents);
            refreshMemoryBtn.addEventListener('click', loadMemory);
        }

        // Auto-resize textarea
        function autoResizeTextarea() {
            taskInput.style.height = 'auto';
            taskInput.style.height = Math.min(taskInput.scrollHeight, 150) + 'px';
        }

        // Toggle create agent form
        function toggleCreateAgentForm() {
            const isHidden = createAgentForm.style.display === 'none';
            createAgentForm.style.display = isHidden ? 'block' : 'none';
            toggleCreateAgentBtn.textContent = isHidden ? '− Скрыть форму' : '+ Создать агента';
        }

        // Load agents (Hive architecture)
        async function loadAgents() {
            try {
                const response = await fetch(`${API_BASE}/api/agents`);
                const data = await response.json();
                
                hiveStatus = {
                    boss: data.boss || null,
                    workers: data.workers || []
                };
                
                updateAgentsList();
                updateHiveStatusText();
                
                const totalAgents = (hiveStatus.boss ? 1 : 0) + hiveStatus.workers.length;
                agentCountEl.textContent = totalAgents;
            } catch (error) {
                console.error('Failed to load hive status:', error);
                addSystemMessage('Ошибка загрузки статуса улья');
            }
        }

        // Update hive status text in header
        function updateHiveStatusText() {
            const statusText = document.getElementById('hiveStatusText');
            if (!hiveStatus.boss) {
                statusText.textContent = '⚠️ Нет БОССА — создайте первого агента';
                statusText.style.color = 'var(--warning-color)';
            } else if (hiveStatus.workers.length === 0) {
                statusText.textContent = `👑 ${hiveStatus.boss.name} (ждёт исполнителей)`;
                statusText.style.color = 'var(--accent-color)';
            } else {
                statusText.textContent = `👑 ${hiveStatus.boss.name} + ${hiveStatus.workers.length} исп.`;
                statusText.style.color = 'var(--success-color)';
            }
        }

        // Update agents list in sidebar (show Boss + Workers)
        function updateAgentsList() {
            let html = '';
            
            // Boss card
            if (hiveStatus.boss) {
                html += `
                    <div class="agent-card" style="border-color: var(--accent-color);">
                        <div class="agent-card-header">
                            <div class="agent-name">👑 ${escapeHtml(hiveStatus.boss.name)}</div>
                            <div class="agent-status"></div>
                        </div>
                        <div class="agent-model">${escapeHtml(hiveStatus.boss.model)}</div>
                        <div style="font-size:11px;color:var(--accent-color);margin-top:4px;">BOSS</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="agent-card" style="border-style:dashed;">
                        <div class="empty-state-text">Первый агент станет БОССОМ</div>
                    </div>
                `;
            }
            
            // Workers cards
            if (hiveStatus.workers.length > 0) {
                hiveStatus.workers.forEach(worker => {
                    html += `
                        <div class="agent-card">
                            <div class="agent-card-header">
                                <div class="agent-name">🔧 ${escapeHtml(worker.name)}</div>
                                <div class="agent-status"></div>
                            </div>
                            <div class="agent-model">${escapeHtml(worker.model)}</div>
                            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${escapeHtml(worker.role)}</div>
                        </div>
                    `;
                });
            } else if (hiveStatus.boss) {
                html += `
                    <div class="empty-state" style="padding:10px;">
                        <div class="empty-state-text" style="font-size:12px;">Нет рабочих агентов. Добавьте исполнителей.</div>
                    </div>
                `;
            }
            
            agentsList.innerHTML = html;
        }

        // Load memory
        async function loadMemory() {
            try {
                const response = await fetch(`${API_BASE}/api/memory`);
                const data = await response.json();
                
                memoryNodesEl.textContent = data.graph_nodes || 0;
                updateMemoryLessons(data.lessons || []);
            } catch (error) {
                console.error('Failed to load memory:', error);
            }
        }

        // Update memory lessons
        function updateMemoryLessons(lessons) {
            if (lessons.length === 0) {
                memoryLessons.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-text">Нет сохраненных уроков</div>
                    </div>
                `;
                return;
            }

            memoryLessons.innerHTML = lessons.map(lesson => `
                <div class="lesson-card">
                    <div class="lesson-keyword">${escapeHtml(lesson.keyword)}</div>
                    <div class="lesson-text">${escapeHtml(lesson.text)}</div>
                    <div class="lesson-count">Частота: ${lesson.count}</div>
                </div>
            `).join('');
        }

        // Create agent (Hive architecture - first is Boss, rest are Workers)
        async function createAgent() {
            const name = document.getElementById('agentName').value.trim();
            const role = document.getElementById('agentRole').value.trim();
            const model = document.getElementById('agentModel').value.trim();
            const baseUrl = document.getElementById('agentBaseUrl').value.trim();
            const apiKey = document.getElementById('agentApiKey').value.trim();

            if (!name) {
                alert('Введите имя агента');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/agents`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        role: role || 'worker',
                        base_url: baseUrl || 'https://integrate.api.nvidia.com/v1',
                        api_key: apiKey || 'skip'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const agentType = data.role === 'boss' ? 'БОСС' : 'Исполнитель';
                    addSystemMessage(`Создан ${agentType}: "${name}"`);
                    toggleCreateAgentForm();
                    loadAgents();
                    
                    // Clear form
                    document.getElementById('agentName').value = '';
                    document.getElementById('agentRole').value = '';
                    document.getElementById('agentModel').value = '';
                    document.getElementById('agentBaseUrl').value = '';
                    document.getElementById('agentApiKey').value = '';
                } else {
                    alert(data.error || 'Ошибка создания агента');
                }
            } catch (error) {
                console.error('Failed to create agent:', error);
                alert('Ошибка создания агента');
            }
        }

        // Send message (no agent selection - always goes to Boss)
        function sendMessage() {
            const task = taskInput.value.trim();

            if (!task || isProcessing) return;

            if (!hiveStatus.boss) {
                alert('Сначала создайте агента-БОССА');
                return;
            }

            // Add user message
            addUserMessage(task);
            taskInput.value = '';
            autoResizeTextarea();

            // Start streaming to Boss
            startStreaming(task);
        }

        // Start SSE streaming (Hive architecture)
        function startStreaming(task) {
            isProcessing = true;
            sendBtn.disabled = true;
            sendBtn.textContent = 'Выполнение...';

            // Add typing indicator
            const typingId = addTypingIndicator();

            fetch(`${API_BASE}/api/chat/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task })
            })
            .then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            removeTypingIndicator(typingId);
                            isProcessing = false;
                            sendBtn.disabled = false;
                            sendBtn.textContent = 'Отправить';
                            loadMemory();
                            return;
                        }

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    handleStreamEvent(data, typingId);
                                } catch (e) {
                                    console.error('Parse error:', e);
                                }
                            }
                        }

                        readStream();
                    });
                }

                readStream();
            })
            .catch(error => {
                console.error('Stream error:', error);
                removeTypingIndicator(typingId);
                addSystemMessage('Ошибка потока: ' + error.message);
                isProcessing = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
            });
        }

        // Handle stream events (Hive architecture)
        function handleStreamEvent(data, typingId) {
            const type = data.type;

            if (type === 'delegation') {
                // Boss delegates to worker
                removeTypingIndicator(typingId);
                addProcessMessage('delegation', data.content);
            } else if (type === 'thought') {
                addProcessMessage('thought', data.content);
            } else if (type === 'action') {
                addProcessMessage('action', data.content);
            } else if (type === 'result' || type === 'message') {
                removeTypingIndicator(typingId);
                addAssistantMessage(data.content);
            } else if (type === 'error') {
                removeTypingIndicator(typingId);
                addSystemMessage('Ошибка: ' + data.content);
            }
        }

        // Add user message
        function addUserMessage(content) {
            clearEmptyState();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add assistant message
        function addAssistantMessage(content) {
            clearEmptyState();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            // Parse markdown
            const htmlContent = marked.parse(content);
            messageDiv.innerHTML = `<div class="message-content">${htmlContent}</div>`;
            
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add process message (thought, action, observation)
        function addProcessMessage(type, content) {
            clearEmptyState();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message process';
            
            let icon = '💭';
            let label = 'Мысль';
            let colorClass = 'process-thought';
            
            if (type === 'action') {
                icon = '⚡';
                label = 'Действие';
                colorClass = 'process-action';
            } else if (type === 'observation') {
                icon = '👁️';
                label = 'Наблюдение';
                colorClass = 'process-observation';
            } else if (type === 'error') {
                icon = '❌';
                label = 'Ошибка';
                colorClass = 'process-error';
            }

            messageDiv.innerHTML = `
                <div class="${colorClass}">
                    <strong>${icon} ${label}:</strong><br>
                    ${escapeHtml(content)}
                </div>
            `;
            
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add system message
        function addSystemMessage(content) {
            clearEmptyState();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add typing indicator
        function addTypingIndicator() {
            clearEmptyState();
            
            const id = 'typing-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = id;
            messageDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
            return id;
        }

        // Remove typing indicator
        function removeTypingIndicator(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        // Clear empty state
        function clearEmptyState() {
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
        }

        // Scroll to bottom
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
